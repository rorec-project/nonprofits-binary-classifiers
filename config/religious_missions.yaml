# Binary classifier configuration for the "religious vs. non-religious missions"
# task. This is the first concrete task in the classification pipeline.
#
# Entity being classified: missions
# Text field: LONGEST_MISSION
# Label: religious (positive class = 1)

SEED: 42

entity: missions
field: LONGEST_MISSION
label_name: religious

paths:
  upstream_repo: ../NonProfitData
  missions_parquet: data/processed/corpus/missions/missions_cross_section.parquet
  bmf_parquet: data/processed/panel/core/bmf_unified_processed.parquet
  output_dir: .
  data_dir: data
  train_test_dir: train_test_datasets
  results_dir: results
  models_dir: models
  # Gold is committed (human-coded artifacts); silver is the cloud-symlinked
  # machine-labelled pool. Set these to match your local folder layout.
  gold_dir: data/processed/train_test_datasets/gold
  silver_dir: data/processed/train_test_datasets/silver

# Config-driven slate: each candidate is tagged with its serving provider so
# the annotator factory can route construction. OpenAI ids are floating
# aliases (placeholders) — pin to dated snapshots before a production run.
# The Gemma arm needs the vLLM server up during the bake-off; comment it out
# for a pure-OpenAI bake-off. Stage 03 only runs the human-confirmed slate
# (production_slate.json), so `production` below is just the default seed.
model_slate:
  bakeoff_candidates:
    - id: gpt-4o-mini
      provider: openai
    - id: gpt-5-mini
      provider: openai
      reasoning_effort: minimal
    - id: gpt-5-nano
      provider: openai
      reasoning_effort: minimal
    - id: google/gemma-3-27b-it
      provider: vllm
  production: gpt-5-mini

q_thresholds:
  HIGH: 5.0
  MEDIUM: 3.0
  LOW: 0.0

sample_sizes:
  silver: 20000
  gold: 400
  prompt_dev: 50

annotation:
  temperature: 0.0
  max_retries: 5
  checkpoint_every: 100
  guided_json: true
  seed: 42

data:
  # Hard-fail on a missing upstream parquet unless explicitly opted in.
  allow_synthetic: false

qc:
  # Minimum LLM-vs-human validation agreement required to freeze silver labels.
  agreement_threshold: 0.85

training:
  learning_rate: 5.0e-5
  batch_size: 16
  epochs: 10
  weight_decay: 0.01
  metric_for_best_model: pr_auc
  greater_is_better: true
  early_stopping_patience: 4
  save_total_limit: 2
  fp16: true
